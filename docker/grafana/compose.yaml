# Grafana for SPEC 08, outside the cluster (the node could not run it).
# Start: docker compose -f docker/grafana/compose.yaml up -d
# SPEC 09: the datasource and the dashboard are provisioned from the repo, so they appear on start.
# The datasource URL is http://host.docker.internal:19090 (the Prometheus port-forward), see provisioning/.
services:
  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ../../k8s/grafana-dashboard.json:/etc/grafana/dashboards/churn-serving.json:ro
    restart: unless-stopped
volumes:
  grafana-data:
