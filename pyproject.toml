[project]
name = "churn-mlops"
version = "0.1.0"
description = "Bank customer churn: end-to-end MLOps on Kubeflow"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "scikit-learn==1.5.2",
    "mlflow-skinny",
    "skops",
    "optuna",
    "pandas",
    "joblib",
    "kfp==2.15.0",
    "xgboost==3.2.0",
    "lightgbm==4.7.0",
]

[dependency-groups]
dev = ["jupyter", "matplotlib", "kfp-kubernetes==2.15.0"]
