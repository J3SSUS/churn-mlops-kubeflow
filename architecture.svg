<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="600" fill="#111">Bank Customer Churn — MLOps on Kubeflow (architecture v0.2)</text>

  <!-- Left column (outside the cluster) -->
  <rect x="20" y="130" width="150" height="90" rx="8" fill="#fff" stroke="#888"/>
  <text x="95" y="160" text-anchor="middle" font-weight="600">You</text>
  <text x="95" y="180" text-anchor="middle" font-size="11">kfp SDK · kubectl</text>
  <text x="95" y="196" text-anchor="middle" font-size="11">browser (UIs)</text>
  <rect x="20" y="340" width="150" height="90" rx="8" fill="#fff" stroke="#888"/>
  <text x="95" y="368" text-anchor="middle" font-weight="600">Kaggle CSVs</text>
  <text x="95" y="388" text-anchor="middle" font-size="11">train.csv (15k, label)</text>
  <text x="95" y="404" text-anchor="middle" font-size="11">test.csv (10k, no label)</text>
  <text x="95" y="420" text-anchor="middle" font-size="11" fill="#666">local disk</text>

  <!-- Cluster -->
  <rect x="200" y="55" width="980" height="725" rx="12" fill="#fafafa" stroke="#555" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="215" y="76" font-weight="600" fill="#333">minikube cluster (Docker Desktop, arm64) · K8s v1.29</text>

  <!-- Pipeline 1 band -->
  <rect x="220" y="90" width="940" height="200" rx="10" fill="#eef4ff" stroke="#5b8def"/>
  <text x="235" y="112" font-weight="600" fill="#2a4fa0">Pipeline 1 — Training (KFP v2, ns kubeflow)</text>
  <g fill="#fff" stroke="#5b8def">
    <rect x="235" y="150" width="110" height="60" rx="6"/>
    <rect x="370" y="150" width="110" height="60" rx="6"/>
    <rect x="505" y="150" width="150" height="60" rx="6"/>
    <rect x="680" y="150" width="110" height="60" rx="6"/>
    <rect x="815" y="150" width="110" height="60" rx="6"/>
    <rect x="950" y="150" width="110" height="60" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="290" y="175" font-weight="600">Ingest</text><text x="290" y="193" font-size="11">schema · nulls</text>
    <text x="425" y="170" font-weight="600">Preprocess</text><text x="425" y="187" font-size="11">stratified split</text><text x="425" y="201" font-size="11">define transformer</text>
    <text x="580" y="170" font-weight="600">Tune (ParallelFor)</text><text x="580" y="187" font-size="11">LogReg · RF · HistGB</text><text x="580" y="201" font-size="11">Optuna TPE · 5-fold CV</text>
    <text x="735" y="170" font-weight="600">Evaluate</text><text x="735" y="187" font-size="11">hold-out ROC-AUC</text><text x="735" y="201" font-size="11">vs Dummy baseline</text>
    <text x="870" y="170" font-weight="600">Gate</text><text x="870" y="187" font-size="11">dsl.If: beats</text><text x="870" y="201" font-size="11">baseline + champion</text>
    <text x="1005" y="170" font-weight="600">Register</text><text x="1005" y="187" font-size="11">refit train+hold-out</text><text x="1005" y="201" font-size="11">alias @champion</text>
  </g>
  <g stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <path d="M345,180 H368"/><path d="M480,180 H503"/><path d="M655,180 H678"/><path d="M790,180 H813"/><path d="M925,180 H948"/>
  </g>
  <text x="235" y="250" font-size="11" fill="#555">Each step runs as a pod (image churn-base).</text>

  <!-- Middle row -->
  <rect x="220" y="330" width="200" height="110" rx="8" fill="#fff" stroke="#888"/>
  <text x="320" y="356" text-anchor="middle" font-weight="600">PVC churn-data</text>
  <text x="320" y="376" text-anchor="middle" font-size="11">raw CSVs · processed data</text>
  <text x="320" y="392" text-anchor="middle" font-size="11">models/churn/vN/model.joblib</text>
  <text x="320" y="420" text-anchor="middle" font-size="11" fill="#666">ns kubeflow</text>

  <rect x="460" y="330" width="260" height="110" rx="8" fill="#fff3e6" stroke="#e08a1e"/>
  <text x="590" y="356" text-anchor="middle" font-weight="600" fill="#9a5a00">MLflow server</text>
  <text x="590" y="376" text-anchor="middle" font-size="11">tracking + model registry</text>
  <text x="590" y="392" text-anchor="middle" font-size="11">--serve-artifacts · SQLite</text>
  <text x="590" y="408" text-anchor="middle" font-size="11">own PVC mlflow-data</text>
  <text x="590" y="428" text-anchor="middle" font-size="11" fill="#666">ns mlflow · UI via port-forward</text>

  <rect x="760" y="330" width="400" height="110" rx="8" fill="#fff" stroke="#888"/>
  <text x="960" y="358" text-anchor="middle" font-weight="600">KFP platform (ns kubeflow)</text>
  <text x="960" y="379" text-anchor="middle" font-size="11">API server · Argo workflow controller · UI</text>
  <text x="960" y="395" text-anchor="middle" font-size="11">SeaweedFS (artifacts) · MySQL (metadata)</text>
  <text x="960" y="420" text-anchor="middle" font-size="11" fill="#666">already installed (KFP 2.15.0)</text>

  <!-- Pipeline 2 band -->
  <rect x="220" y="480" width="940" height="120" rx="10" fill="#f3ecff" stroke="#8a5bd6"/>
  <text x="1145" y="500" text-anchor="end" font-weight="600" fill="#5a2fa0">Pipeline 2 — Deploy (KFP v2, ns kubeflow) · manual run after Pipeline 1</text>
  <g fill="#fff" stroke="#8a5bd6">
    <rect x="480" y="515" width="200" height="60" rx="6"/>
    <rect x="715" y="515" width="240" height="60" rx="6"/>
    <rect x="990" y="515" width="150" height="60" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="580" y="537" font-weight="600">Fetch champion</text><text x="580" y="553" font-size="11">mlflow.sklearn.load_model</text><text x="580" y="567" font-size="11">→ joblib.dump to PVC</text>
    <text x="835" y="537" font-weight="600">Publish InferenceService</text><text x="835" y="553" font-size="11">storageUri pvc://churn-data/…</text><text x="835" y="567" font-size="11">PREDICT_PROBA=true</text>
    <text x="1065" y="540" font-weight="600">Smoke test</text><text x="1065" y="558" font-size="11">:predict → probas</text>
  </g>
  <g stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <path d="M680,545 H713"/><path d="M955,545 H988"/>
  </g>

  <!-- Bottom row -->
  <rect x="220" y="630" width="180" height="110" rx="8" fill="#fff" stroke="#888"/>
  <text x="310" y="656" text-anchor="middle" font-weight="600">Load generator</text>
  <text x="310" y="676" text-anchor="middle" font-size="11">replays test.csv rows</text>
  <text x="310" y="692" text-anchor="middle" font-size="11">writes submission.csv</text>
  <text x="310" y="720" text-anchor="middle" font-size="11" fill="#666">Job · ns kubeflow · PVC</text>

  <rect x="450" y="630" width="280" height="110" rx="8" fill="#f3ecff" stroke="#8a5bd6"/>
  <text x="590" y="656" text-anchor="middle" font-weight="600" fill="#5a2fa0">KServe InferenceService "churn"</text>
  <text x="590" y="677" text-anchor="middle" font-size="11">sklearn predictor · Standard mode</text>
  <text x="590" y="693" text-anchor="middle" font-size="11">/v1/models/churn:predict</text>
  <text x="590" y="720" text-anchor="middle" font-size="11" fill="#666">ns kubeflow · KServe v0.21.0</text>

  <rect x="780" y="630" width="170" height="110" rx="8" fill="#eaf7ee" stroke="#2f9e5b"/>
  <text x="865" y="660" text-anchor="middle" font-weight="600" fill="#1d6b3c">Prometheus</text>
  <text x="865" y="681" text-anchor="middle" font-size="11">scrapes serving</text>
  <text x="865" y="697" text-anchor="middle" font-size="11">metrics</text>
  <text x="865" y="722" text-anchor="middle" font-size="11" fill="#666">ns monitoring · Helm</text>

  <rect x="990" y="630" width="170" height="110" rx="8" fill="#eaf7ee" stroke="#2f9e5b"/>
  <text x="1075" y="660" text-anchor="middle" font-weight="600" fill="#1d6b3c">Grafana</text>
  <text x="1075" y="681" text-anchor="middle" font-size="11">rate · p50/p95 latency</text>
  <text x="1075" y="697" text-anchor="middle" font-size="11">· errors</text>
  <text x="1075" y="722" text-anchor="middle" font-size="11" fill="#666">ns monitoring · Helm</text>

  <text x="215" y="768" font-size="11" fill="#555">churn-base image (built with minikube image build): scikit-learn pinned to KServe's sklearnserver version, mlflow, optuna, pandas, joblib.</text>

  <!-- Arrows between layers -->
  <g stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <path d="M170,175 H218"/>                    <!-- you -> pipeline 1 -->
    <path d="M20,200 H8 V540 H218"/>             <!-- you -> pipeline 2 -->
    <path d="M170,385 H218"/>                    <!-- csv -> pvc -->
    <path d="M320,330 V292"/>                    <!-- pvc -> pipeline 1 -->
    <path d="M540,210 V328"/>                    <!-- tune -> mlflow -->
    <path d="M1005,210 V310 H650 V328"/>         <!-- register -> mlflow -->
    <path d="M580,440 V513"/>                    <!-- mlflow -> fetch -->
    <path d="M480,545 H400 V442"/>               <!-- fetch -> pvc (model.joblib) -->
    <path d="M350,440 V612 H470 V628"/>          <!-- pvc -> kserve (mount) -->
    <path d="M835,575 V612 H590 V628"/>          <!-- publish -> kserve -->
    <path d="M400,685 H448"/>                    <!-- loadgen -> kserve -->
    <path d="M778,685 H732"/>                    <!-- prometheus -> kserve (scrape) -->
    <path d="M988,685 H952"/>                    <!-- grafana -> prometheus -->
  </g>
  <g stroke="#444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" fill="none">
    <path d="M1100,330 V292"/>                   <!-- kfp -> pipeline 1 -->
    <path d="M1100,440 V478"/>                   <!-- kfp -> pipeline 2 -->
  </g>
  <g font-size="11" fill="#444">
    <text x="548" y="270">log runs + trials</text>
    <text x="780" y="304">register model</text>
    <text x="326" y="314">reads data</text>
    <text x="1094" y="316" text-anchor="end">runs pods</text>
    <text x="1094" y="464" text-anchor="end">runs pods</text>
    <text x="588" y="466">load @champion</text>
    <text x="406" y="466">writes model.joblib</text>
    <text x="344" y="530" text-anchor="end">mounts PVC</text>
    <text x="14" y="532">submit runs</text>
    <text x="745" y="678">scrape</text>
    <text x="960" y="678">query</text>
  </g>
</svg>
